name: pokerepo
on:
  schedule: [{ cron: "0 21 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wantaekchoi/pokerepo@v1
        with:
          party: "1"
          # Keep README card as Lillipup; Dex still updates from trainer.json
          readme: ".github/pokerepo-card.md"
